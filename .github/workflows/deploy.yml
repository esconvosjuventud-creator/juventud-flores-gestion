name: Deploy GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar JavaScript crítico
        run: |
          node --check soraya-pdf-engine.js
          node --check letterhead-bg-1.js
          node --check letterhead-bg-2.js
          node --check letterhead-bg-3.js
          node --check letterhead-bg-4.js
          node --check letterhead-bg-5.js
          node --check letterhead-background.js
          node --check letterhead-template.js
          node --check letterhead-official-meta.js
          node --check soraya-i18n.js
          node --check task-teamwork.js
          node --check google-auto-connect.js
          node --check google-unified-sync.js
          node --check universal-search.js
          node --check duplicate-detector.js
          node --check ui-professional.js
      - name: Prueba real del motor PDF
        run: |
          node - <<'NODE'
          global.window=global;
          require('./soraya-pdf-engine.js');
          require('./letterhead-bg-1.js');
          require('./letterhead-bg-2.js');
          require('./letterhead-bg-3.js');
          require('./letterhead-bg-4.js');
          require('./letterhead-bg-5.js');
          require('./letterhead-background.js');
          const b64=(global.SORAYA_LETTERHEAD_BG||'').split(',')[1]||'';
          const image=Buffer.from(b64,'base64');
          if(image.length<7000) throw new Error('El membrete quedó incompleto');
          if(image[0]!==0xff || image[1]!==0xd8 || image[image.length-2]!==0xff || image[image.length-1]!==0xd9) throw new Error('JPEG de membrete inválido o truncado');
          const doc=new global.SorayaPDFEngine.PDFDoc();
          doc.addImage(global.SORAYA_LETTERHEAD_BG,'JPEG',0,0,210,297);
          doc.setFont('helvetica','bold').setFontSize(12).text('PRUEBA SORAYA',20,55);
          doc.setFont('helvetica','normal').setFontSize(10).text('Oficina de la Juventud - PDF institucional',20,70);
          const bytes=doc.toUint8Array();
          const head=Buffer.from(bytes.slice(0,8)).toString('latin1');
          const tail=Buffer.from(bytes.slice(-20)).toString('latin1');
          if(!head.startsWith('%PDF-1.4')) throw new Error('Encabezado PDF inválido');
          if(!tail.includes('%%EOF')) throw new Error('PDF incompleto');
          if(bytes.length<=image.length) throw new Error('El PDF no contiene estructura adicional al membrete');
          console.log('Membrete OK:',image.length,'bytes · PDF OK:',bytes.length,'bytes');
          NODE
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
